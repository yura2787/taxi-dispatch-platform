# The only place the OSRM version is defined: the graph must be built by the same
# version that serves it, so osrm-prepare and osrm both use this anchor.
x-osrm-image: &osrm-image ghcr.io/project-osrm/osrm-backend:v26.4.0

services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build: ./core
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${DJANGO_PORT}:8000"
    volumes:
      - ./core:/app
    depends_on:
      postgres:
        condition: service_healthy

  realtime:
    build: ./realtime
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
    environment:
      REDIS_URL: redis://redis:6379/0
      OSRM_URL: http://osrm:5000
      # Unsigned dev tokens for WebSocket auth; never set outside local development.
      DEV_AUTH: "1"
    ports:
      - "${REALTIME_PORT}:8001"
    volumes:
      - ./realtime:/app
    # No depends_on osrm: realtime must work (with degraded routing) without it.
    depends_on:
      redis:
        condition: service_healthy

  # Needs the graph from `make osrm`. No published port: only services inside the
  # Docker network talk to it. No restart policy: without a graph it would crash-loop.
  osrm:
    image: *osrm-image
    command: ["osrm-routed", "--algorithm", "mld", "/data/chernivtsi.osrm"]
    volumes:
      - ./infra/osrm/data:/data:ro
    healthcheck:
      # Cheapest real query: snap the city centre to the nearest road. 127.0.0.1, not
      # localhost: that resolves to IPv6 ::1, and osrm-routed listens on IPv4 only.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/nearest/v1/driving/25.9358,48.2921"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Graph preparation tools, used only by infra/osrm/prepare.sh (`make osrm`) ---
  osrm-prepare:
    image: *osrm-image
    profiles: [tools]
    volumes:
      - ./infra/osrm/data:/data

  osmium:
    build:
      context: ./infra/osrm
      dockerfile: osmium.Dockerfile
    profiles: [tools]
    volumes:
      - ./infra/osrm/data:/data

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules instead of the (empty) host folder.
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django
      - realtime
      - frontend

volumes:
  postgres_data:
  redis_data:
