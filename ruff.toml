target-version = "py312"
line-length = 100

# Each service has its own import root (`config` in core, `app` in realtime,
# `sim` in simulator), so isort must know them to classify first-party imports.
src = ["core", "realtime", "simulator"]

# Django migrations are generated code; we never edit them by hand.
extend-exclude = ["**/migrations/*"]

[lint]
select = ["E", "F", "I", "UP", "B"]
