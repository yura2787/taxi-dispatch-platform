[project]
name = "rideflow-realtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "redis>=8.1,<9",
    "httpx>=0.28,<0.29",
    "prometheus-client>=0.26,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "osrm: integration tests against a real OSRM server (skipped if it is not running)",
]
