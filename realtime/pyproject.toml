[project]
name = "rideflow-realtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "redis>=8.1,<9",
    "httpx>=0.28,<0.29",
    "prometheus-client>=0.26,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
]

[tool.pytest.ini_options]
# Coverage on every run, so a gap shows up while the code is still fresh
# instead of on the pull request.
# --cov=. (not --cov=app): report paths then start with the package
# (app/main.py, not main.py), so Codecov can tell files apart.
addopts = "--cov=. --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "osrm: integration tests against a real OSRM server (skipped if it is not running)",
]

[tool.coverage.run]
omit = [
    # Only the service code is measured; --cov=. would otherwise add the tests.
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    # Entry points of `python -m app.<module>`: tests call main() directly.
    'if __name__ == "__main__":',
]
