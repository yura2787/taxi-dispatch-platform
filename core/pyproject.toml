[project]
name = "rideflow-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.3,<4",
    "gunicorn>=26.2,<27",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-django>=4.14,<5",
]

[tool.pytest.ini_options]
# Coverage on every run, so a gap shows up while the code is still fresh
# instead of on the pull request.
addopts = "--cov=config --cov=apps --cov-report=term-missing"
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]

[tool.coverage.run]
omit = [
    # Entry points for real servers; tests call views through the test client.
    "config/asgi.py",
    "config/wsgi.py",
    "manage.py",
    # Dev settings are never loaded under pytest (test.py and base.py are).
    "config/settings/dev.py",
    # Generated by Django, never edited by hand.
    "**/migrations/*",
]
