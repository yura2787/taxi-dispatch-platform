codecov:
  notify:
    # Every commit uploads 4 reports (core-tests, realtime-tests, osrm-tests,
    # simulator-tests). Without this, statuses are computed from the first one, and
    # the missing services look like a coverage drop until the rest arrive.
    after_n_builds: 4

comment:
  after_n_builds: 4

coverage:
  status:
    # At least 70 % of the lines a pull request adds or changes must be covered,
    # with 2 % of slack.
    patch:
      default:
        target: 70%
        threshold: 2%
    # Overall coverage may fall by at most 2 % against the base commit.
    project:
      default:
        target: auto
        threshold: 2%

# Report paths are relative to each service (config/health.py, app/main.py);
# prefix them with the service folder instead of letting Codecov guess.
fixes:
  - "config/::core/config/"
  - "apps/::core/apps/"
  - "conftest.py::core/conftest.py"
  - "app/::realtime/app/"
  - "sim/::simulator/sim/"

# One flag per service, so each has its own coverage on codecov.io. Reports with
# the same flag are merged: realtime is uploaded by both the unit and OSRM jobs.
flags:
  core:
    paths:
      - core/
  realtime:
    paths:
      - realtime/
  simulator:
    paths:
      - simulator/
