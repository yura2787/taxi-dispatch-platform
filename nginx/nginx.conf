worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS. Upstreams are resolved per request (see "set $upstream"
    # below), so nginx starts even if a service is down and follows container
    # IP changes after restarts instead of caching the first resolved address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket support: forward "Connection: upgrade" only for upgrade requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name _;

        # Relative Location in nginx's own redirects: inside the container nginx
        # listens on 80, so absolute ones would drop the published host port.
        absolute_redirect off;

        # $http_host keeps the client port (localhost:8080). Django's CSRF check
        # compares the Origin header with the Host, so dropping the port breaks
        # every POST, e.g. admin login.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Set once at server level: proxy_set_header is inherited by a location only
        # if that location defines none of its own. Harmless for plain HTTP requests.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # --- Django ---
        location /api/ {
            set $upstream http://django:8000;
            proxy_pass $upstream;
        }

        location /admin/ {
            set $upstream http://django:8000;
            proxy_pass $upstream;
        }

        location = /admin {
            return 301 /admin/;
        }

        # Django static files (admin CSS/JS) served by runserver in dev.
        location /static/ {
            set $upstream http://django:8000;
            proxy_pass $upstream;
        }

        # Service-to-service only: FastAPI calls django:8000/internal/ directly
        # inside the Docker network, so it is never exposed to the outside.
        location /internal/ {
            return 403;
        }

        # --- FastAPI realtime (REST + WebSocket) ---
        # Prometheus scrapes realtime:8001 directly, never through nginx.
        location ^~ /rt/metrics {
            return 403;
        }

        location /rt/ {
            set $upstream http://realtime:8001;
            proxy_pass $upstream;
            proxy_read_timeout 1h;
        }

        # --- Frontend (Vite dev server, WebSocket for HMR) ---
        location / {
            set $upstream http://frontend:5173;
            proxy_pass $upstream;
            proxy_read_timeout 1h;
        }
    }
}
