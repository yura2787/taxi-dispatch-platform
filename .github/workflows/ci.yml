name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with RUFF_VERSION in the Makefile.
  RUFF_VERSION: "0.16.10"
  PYTHON_VERSION: "3.12"
  # Keep in sync with the uv image tag in core/ and realtime/ Dockerfiles.
  UV_VERSION: "0.11.15"
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check core realtime
      - run: ruff format --check core realtime

  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rideflow
          POSTGRES_USER: rideflow
          POSTGRES_PASSWORD: rideflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rideflow -d rideflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: rideflow
      POSTGRES_USER: rideflow
      POSTGRES_PASSWORD: rideflow
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Install GDAL and GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/coverage.xml
          flags: core
          # Only this report, not every coverage file found in the repository.
          disable_search: true
          # An outage of Codecov must not turn CI red.
          fail_ci_if_error: false

  realtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The `redis` fixture refuses DB 0, as `make test` does locally.
      REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: realtime
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: realtime/uv.lock
      - run: uv sync --frozen
      # Integration tests need a real OSRM; they run in the osrm-tests job.
      - run: uv run pytest -m "not osrm" --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: realtime/coverage.xml
          flags: realtime
          # Only this report, not every coverage file found in the repository.
          disable_search: true
          # An outage of Codecov must not turn CI red.
          fail_ci_if_error: false

  # Integration tests against a real OSRM with the pinned Chernivtsi graph.
  osrm-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSRM_URL: http://localhost:5000
      # Fail instead of skipping when OSRM is not reachable.
      OSRM_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      # docker compose interpolates ${...} from .env even for `config`/`run`.
      - run: cp .env.example .env
      - name: Read the OSRM image from docker-compose.yml
        id: osrm
        run: echo "image=$(docker compose config --images osrm)" >> "$GITHUB_OUTPUT"
      # Only the city extract and the graph: the ~850 MB country file is not cached.
      - uses: actions/cache@v6
        with:
          path: infra/osrm/data/chernivtsi.*
          key: osrm-${{ hashFiles('infra/osrm/map.env') }}-${{ steps.osrm.outputs.image }}
      # On a cache hit the stamp matches and this does nothing.
      - run: make osrm
      # Published port only here: the tests run on the runner, not in the Compose network.
      - name: Start OSRM
        run: |
          docker run -d --name osrm -p 5000:5000 -v "$PWD/infra/osrm/data:/data:ro" \
            "${{ steps.osrm.outputs.image }}" osrm-routed --algorithm mld /data/chernivtsi.osrm
          for _ in $(seq 30); do
            curl -sf "$OSRM_URL/nearest/v1/driving/25.9358,48.2921" > /dev/null && exit 0
            sleep 1
          done
          docker logs osrm
          exit 1
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: realtime/uv.lock
      - run: uv sync --frozen
        working-directory: realtime
      - run: uv run pytest -m osrm --cov-report=xml
        working-directory: realtime
      # Same flag as the unit tests: Codecov merges both into the realtime coverage.
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: realtime/coverage.xml
          flags: realtime
          # Only this report, not every coverage file found in the repository.
          disable_search: true
          # An outage of Codecov must not turn CI red.
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
